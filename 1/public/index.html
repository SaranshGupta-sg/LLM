
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant AI Assistant</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff7ed, #ffedd5);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .chat-container {
        width: 100%;
        max-width: 650px;
        height: 700px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #f97316, #ea580c);
        color: white;
        padding: 22px 25px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .restaurant-icon {
        width: 48px;
        height: 48px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
      }

      .header h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 13px;
        opacity: 0.9;
      }

      /* Chat area */
      #chat {
        flex: 1;
        padding: 25px;
        overflow-y: auto;
        background: #fafafa;
      }

      .welcome {
        text-align: center;
        margin-top: 120px;
        color: #666;
      }

      .welcome .emoji {
        font-size: 50px;
        margin-bottom: 15px;
      }

      .welcome h2 {
        color: #333;
        margin-bottom: 8px;
      }

      .welcome p {
        font-size: 14px;
      }

      .message {
        display: flex;
        margin-bottom: 18px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.bot {
        justify-content: flex-start;
      }

      .bubble {
        max-width: 75%;
        padding: 13px 17px;
        border-radius: 18px;
        line-height: 1.5;
        font-size: 15px;
        white-space: pre-wrap;
      }

      .user .bubble {
        background: #f97316;
        color: white;
        border-bottom-right-radius: 5px;
      }

      .bot .bubble {
        background: white;
        color: #333;
        border: 1px solid #eee;
        border-bottom-left-radius: 5px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      }

      /* Input area */
      .input-area {
        padding: 18px;
        border-top: 1px solid #eee;
        background: white;
        display: flex;
        gap: 10px;
      }

      #userInput {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
      }

      #userInput:focus {
        border-color: #f97316;
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
      }

      #sendButton {
        border: none;
        background: #f97316;
        color: white;
        padding: 0 22px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      #sendButton:hover {
        background: #ea580c;
        transform: translateY(-1px);
      }

      #sendButton:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      /* Loading */
      .typing {
        display: inline-flex;
        gap: 4px;
        padding: 5px 0;
      }

      .typing span {
        width: 7px;
        height: 7px;
        background: #999;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }

        30% {
          transform: translateY(-5px);
        }
      }

      /* Scrollbar */
      #chat::-webkit-scrollbar {
        width: 6px;
      }

      #chat::-webkit-scrollbar-thumb {
        background: #ddd;
        border-radius: 10px;
      }

      /* Mobile */
      @media (max-width: 600px) {
        body {
          padding: 0;
        }

        .chat-container {
          height: 100vh;
          border-radius: 0;
        }

        .bubble {
          max-width: 85%;
        }
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <!-- Header -->
      <div class="header">
        <div class="restaurant-icon">🍽️</div>

        <div>
          <h1>Restaurant AI Assistant</h1>
          <p>Ask me about today's menu</p>
        </div>
      </div>

      <!-- Chat -->
      <div id="chat">
        <div class="welcome" id="welcome">
          <div class="emoji">👨‍🍳</div>
          <h2>Welcome!</h2>
          <p>Ask me about breakfast, lunch or dinner.</p>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <input
          type="text"
          id="userInput"
          placeholder="Ask me: What's for dinner?"
          autocomplete="off"
        />

        <button id="sendButton" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const input = document.getElementById("userInput");
      const sendButton = document.getElementById("sendButton");
      const chatDiv = document.getElementById("chat");
      const welcome = document.getElementById("welcome");

      async function sendMessage() {
        const userInput = input.value.trim();

        if (!userInput) return;

        // Remove welcome screen
        if (welcome) {
          welcome.remove();
        }

        // Add user message
        addMessage(userInput, "user");

        input.value = "";

        // Disable button
        sendButton.disabled = true;

        // Show typing
        const typingMessage = document.createElement("div");

        typingMessage.className = "message bot";

        typingMessage.innerHTML = `
        <div class="bubble">
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;

        chatDiv.appendChild(typingMessage);

        scrollToBottom();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              input: userInput,
            }),
          });

          const data = await res.json();

          // Remove typing
          typingMessage.remove();

          // Add bot response
          addMessage(data.output || "Sorry, I couldn't find an answer.", "bot");
        } catch (error) {
          typingMessage.remove();

          addMessage("Sorry, something went wrong. Please try again.", "bot");

          console.error(error);
        } finally {
          sendButton.disabled = false;

          input.focus();
        }
      }

      function addMessage(text, type) {
        const message = document.createElement("div");

        message.className = `message ${type}`;

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chatDiv.appendChild(message);

        scrollToBottom();
      }

      function scrollToBottom() {
        chatDiv.scrollTop = chatDiv.scrollHeight;
      }

      // Press Enter to send
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
